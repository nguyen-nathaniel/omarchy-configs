source = ~/.config/omarchy/current/theme/hyprlock.conf



#theme_text_color = rgba(235, 219, 178, 1)

general {
    ignore_empty_input = true
    text_trim = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background

    blur_passes = 4
    blur_size = 1
    noise = 0.02
    contrast = 1.1
    brightness = 0.9
    vibrancy = 0.15
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = fade, 1, 3, ease
    animation = inputField, 1, 4, ease
}

# "ARES", the center dot, and $TIME, placed equidistant, with the dot exactly in the center of the screen's Y axis.
# We use three labels for precise alignment.

# Left-aligned "ARES"
label {
    monitor =
    text = ARES
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 1)
    # X: left margin (e.g. 125 px), Y: centered
    position = 875, 400
    halign = left
    valign = center
    text_align = right
    zindex = 5
}

# Centered "·" (dot) exactly on the screen's center y axis
label {
    monitor =
    text = ·
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 1)
    position = 0,400
    halign = center
    valign = center
    zindex = 6
}

# Right-aligned "$TIME"
label {
    monitor =
    text = $TIME
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 1)
    # X: right margin (-125 px from right), Y: centered
    position = -800, 400
    halign = right
    valign = center
    text_align = right
    zindex = 5
}

# Jarvis-style greeting: typewriter (state file + elapsed time under hyprlock; tty = real loop)
label {
    monitor =
    text = cmd[update:100] /home/nate/.config/hypr/scripts/ares-hyprlock-greeting.sh
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 1)

    position = 0, 105
    halign = center
    valign = center
    text_align = center
    zindex = 4
}



# Rotating scan line: idle cycles first 3 messages; when typing, $PASSDISPLAYLEN > 0 → passphrase (needs patched hyprlock).
label {
    monitor =
    text = cmd[update:200] /home/nate/.config/hypr/scripts/ares-hyprlock-scan.sh $PASSDISPLAYLEN
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(66, 162, 106, 1)
    #color = rgba(32, 194, 14, 1)
    position = 0, 78
    halign = center
    valign = center
    text_align = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:3600000] $HOME/.config/hypr/scripts/ares-hyprlock-identity.sh
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 1)

    position = 0, 50
    halign = center
    valign = center
    text_align = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:500000] /home/nate/.config/hypr/scripts/hyprlock-hardware.sh
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 1)

    position = -40, 1250
    halign = right
    valign = bottom
    text_align = right
}

label {
    monitor =
    text = cmd[update:2000] /home/nate/.config/hypr/scripts/hyprlock-stats.sh

    font_size = 12      # Try making this a bit larger for readability.
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 1)

    # Move it further inward to avoid edge cutoff; adjust to your taste.
    position = 80, 60   

    # If your hyprlock build supports it, try setting an explicit size:
    # size = 640, 520

    halign = left
    valign = bottom
    text_align = left

    # Optionally: zindex = 7  (to test drawing)
}

label {
    monitor =
    text = cmd[update:600000] /home/nate/.config/hypr/scripts/hyprlock-weather.sh
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = rgba(235, 219, 178, 1)

    # Increased padding to move it away from the corner edges
    position = -45, 45 
    
    # These determine the anchor point of the element
    halign = right
    valign = bottom
    
    # This ensures the multi-line text itself is right-aligned
    text_align = right
    zindex = 6
}

input-field {
    monitor =
    size = 500, 70
    position = 0, -42
    halign = center
    valign = center
    zindex = 10

    inner_color = rgba(0, 0, 0, 0.35)
    outer_color = $outer_color
    outline_thickness = 2

    font_family = JetBrainsMono Nerd Font
    font_size = 20
    font_color = $font_color

    placeholder_text =   Enter Password
    placeholder_color = $placeholder_color
    check_color = $check_color
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>Incorrect password ($ATTEMPTS)</i>

    rounding = 12

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)

    fade_on_empty = true
    fade_timeout = 3500
}

auth {
    fingerprint:enabled = false
}
